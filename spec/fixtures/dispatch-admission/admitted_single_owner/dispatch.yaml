- id: verify_stale
  role: qa
  prompt_template: |
    Read the implementation, its tests, tech_solution.md, and stage handoff. Treat the named ledger and task/run records as read-only; put faithful copies, probes, clones, and logs only below the OS temporary root. Audit the tests for substantive criterion coverage and the code for lifecycle-source drift, false legacy inference, false live/completed warnings, hidden auto-close/write paths, bounded rendering, CLI/status-line integration, and truthful ship wording. Independently reproduce base versus current 182/183 output in real temp clones with both dependency trees, then run targeted specs plus build, full test, and lint with direct exits/totals. On the first audit, examine every additional risk you identify and end output.md with a Coverage Map; on re-evaluation, reproduce every rejected item, all full suites, and prior map checks touched by the complete repair diff only. Write verdict_verify_stale.json with pass, reason, outcome complete|escalated, and a criteria map for every assigned ID. Fixable gaps are pass:false; pass:true/outcome:escalated requires a concrete in-scope-unresolvable blocker, never mere retry exhaustion.
  scope: []
  depends_on:
    - implement_stale
  dependency_reasons:
    implement_stale: "The gate must inspect and independently exercise the implementation, permanent tests, baseline, and report evidence produced by implement_stale."
