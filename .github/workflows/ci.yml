name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run build:ui
      - run: npm run lint
      - run: npm test

  public-spec-isolation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull isolated test image
        run: docker pull node:22-bookworm

      - name: Run public spec without network, agent CLIs, or existing state
        run: |
          # Run as the runner's own uid. As root this container wrote root-owned build
          # caches into the bind-mounted workspace, which the runner (and anyone
          # reproducing the job locally) then cannot delete. Matching uids also removes
          # git's "dubious ownership" refusal, so the `git config --system` workaround
          # that used to sit in this script is no longer needed — and would now fail,
          # since a non-root user cannot write /etc/gitconfig. The two changes must
          # stay together.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            --tmpfs /home/flowcrew:rw,nosuid,nodev \
            --env HOME=/home/flowcrew \
            --env PATH=/usr/local/bin:/usr/bin:/bin \
            --workdir /workspace \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            node:22-bookworm \
            sh -ceu '
              test ! -e "$HOME/.fc"
              ! command -v codex
              ! command -v claude
              node ./node_modules/vitest/vitest.mjs run spec
            '

  # TEMPORARY measurement job (spike/macos-measure). Not for main: it exists to
  # turn "we think N things break on macOS" into a list of what actually does.
  # macOS runners have no systemd, no /proc, and no Docker, so the isolation job
  # is deliberately not replicated here.
  macos-measure:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Report the platform we are actually measuring
        run: |
          uname -a
          node -e "console.log('platform', process.platform, 'arch', process.arch)"
          command -v systemctl || echo "systemctl: absent (expected)"
          test -d /proc && echo "/proc: present (unexpected)" || echo "/proc: absent (expected)"

      - run: npm ci
      - run: npm run build
      - run: npm run build:ui

      # No pipe and no `|| true`: the step's own exit code must reach the log.
      # continue-on-error at the job level is what keeps the run from going red.
      - name: Run the public spec suite
        run: node ./node_modules/vitest/vitest.mjs run spec
