name: coding-agent-workflow
description: Implement a scoped code change, verify it, and retry a targeted fix if the QA gate fails.
defaults:
  timeout_ms: 1800000
  max_retries: 2
  max_iterations: 3
stages:
  - id: clarify_scope
    role: planner
    prompt_template: >
      Read the task description and repository context. Write a concise implementation
      approach with target files, acceptance criteria, and risks. Do not modify source code.

  - id: implement_change
    role: coder
    depends_on: [clarify_scope]
    prompt_template: >
      Implement the requested change using the planner's approach. Keep edits scoped
      to the requested behavior, follow existing project patterns, and run only the
      focused checks needed for the changed files.

  - id: verify_change
    role: qa
    depends_on: [implement_change]
    is_gate: true
    prompt_template: >
      Verify the implementation. Write focused tests under tests/ when useful, run
      the relevant checks, and write a clear pass/fail verdict. If this is a
      re-evaluation after a fix, write additional tests targeting the previously
      failed areas and any new edge cases; do not simply re-run the original tests.

  - id: fix_from_qa
    role: coder
    depends_on: [verify_change]
    retry_to: [verify_change]
    prompt_template: >
      If the QA gate failed, fix the reported root cause with minimal edits. Preserve
      passing behavior and rerun the focused checks related to the fix.
