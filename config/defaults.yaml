# Normal authoring budget per execution. A live wrap-up warning arrives before
# the finishing interval (10% of the budget, capped at 5 minutes), reserving a
# further 5.5 seconds for child retirement. Hard stop = max(budget, 5.5s + interval).
# Wrapped work continues in the next finite workflow iteration, without growth.
default_timeout_ms: 10800000
# Minimum observed silence before deterministic idle abort, including local commands.
# Changed output, artifact, CPU/I/O or provider socket receive counters advance progress.
stage_idle_timeout_ms: 600000

# Bound the whole configured validation batch, including a lazy base comparison.
# One batch per judged tree; unfinished facts go to the independent gate.
# Gates consume recorded results and never rerun the configured suite.
validation_timeout_ms: 60000
# Results above this host-wide one-minute load per logical CPU are not measured.
validation_load_ceiling_per_cpu: 1
validation_load_wait_seconds: 1

# Scheduler progress is published on its own loop; an independent process
# warns when a live, identity-bound scheduler stops advancing it.
scheduler_heartbeat_interval_ms: 2000
scheduler_stall_threshold_ms: 120000
scheduler_stall_observer_poll_ms: 5000
# Large worktrees on slow filesystems need a checkout-specific bound. Ordinary
# Git probes retain their smaller command-local bounds.
git_worktree_add_timeout_ms: 1800000
max_iterations: 5
gate_retry_loops: 3
stage_technical_retries: 1
# Bounded re-plan budget for a dynamic_dispatch (plan) stage that exits 0 but
# emits ZERO valid injected stages (truncated/empty/invalid dispatch.yaml — a
# transient LLM flake). Each retry deletes the bad dispatch.yaml, re-runs the
# plan stage with a specific re-prompt, until exhausted (then escalate with the
# parse/unknown-role specifics). Generic engine mechanism, not task logic.
plan_stage_retries: 2
# Runtime resolution is read-only: one installed CLI wins; with both installed,
# Codex is the recommended execution backend. Use `flowcrew adapter <name>` to pin.
adapter: auto
# Largest input, in characters, that each adapter accepts for one stage prompt.
# Review routing sends the complete diff only when it fits this bound; otherwise
# code selects the full independent review, which reads the worktree.
adapter_input_limit_chars:
  # Observed: codex rejects turn/start input above 1048576 characters
  # (code -32602, input_error_code input_too_large; FlowCrew task #2456).
  codex: 1048576
  # Not an observed refusal: the Claude CLI documents no character limit, so
  # this is the 200k-token context at a conservative 3 characters per token.
  claude: 600000
# Legacy input retained for configuration compatibility. Conversation reuse is
# disabled, including opt-in paths: the ledger and diff carry retained facts.
session_reuse: false
# Model/effort: explicit role or engine value > adapter user settings read at
# invocation time > CLI built-in default. Codex reads config.toml; Claude reads
# only model/effort from settings.json while keeping other settings isolated.
model: default
reasoning_effort: default
