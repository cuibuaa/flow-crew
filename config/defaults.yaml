# Sole operator control for a scheduled stage attempt. The deadline is immutable
# once an attempt starts; a timeout retry gets a larger derived attempt budget.
# Longer values reduce premature timeouts but also delay terminal failure.
default_timeout_ms: 3600000
default_max_iterations: 5
default_gate_retry_loops: 3
default_stage_technical_retries: 1
# Bounded re-plan budget for a dynamic_dispatch (plan) stage that exits 0 but
# emits ZERO valid injected stages (truncated/empty/invalid dispatch.yaml — a
# transient LLM flake). Each retry deletes the bad dispatch.yaml, re-runs the
# plan stage with a specific re-prompt, until exhausted (then escalate with the
# parse/unknown-role specifics). Generic engine mechanism, not task logic.
default_plan_stage_retries: 2
# Max times the supervisor's REJECT verdict can force a single deliverable to be
# re-worked before the engine stops re-rejecting and lets the run proceed (so a
# mis-firing supervisor can't trap a run in an infinite reject loop). Generic
# bound; the per-task "what counts as a valid deliverable" lives in the brief.
default_supervisor_max_rejects: 2
# Runtime resolution is read-only: one installed CLI wins; with both installed,
# Codex is the recommended execution backend. Use `flowcrew adapter <name>` to pin.
adapter: auto
# Resume only an explicitly captured per-stage UUID along one proven dependency
# edge. The replicated same-brief A/B measured only 8.999% lower wall time
# (below the 10% enable threshold) while output tokens increased 28.938%, so
# reuse is opt-in; FC_SESSION_REUSE=1 enables an explicit measurement/run.
session_reuse: false
# model/reasoning_effort resolution (adapter, since 7aa5818): explicit value
# here > user's global ~/.codex/config.toml > CLI built-in default. 'default'
# auto-follows the user's own codex setup across CLI upgrades — pin an explicit
# model here only to lock an experiment.
model: default   # Inherit ~/.codex/config.toml; set a model here to override it.
reasoning_effort: default   # Inherit model_reasoning_effort from the adapter config.
paths:
  agents: config/agents
  workflows: config/workflows
campaign_triggers:
  enabled: true
  regression_after: 2
  plateau_after: 3
  plateau_threshold: 5
  repeated_failure_after: 3

supervisor:
  # A 30s cheap heartbeat detects transitions/anomalies. Ordinary semantic LLM
  # review is throttled to 180s and 20 calls/iteration; anomalies bypass both.
  poll_interval_ms: 30000
  routine_assessment_interval_ms: 180000
  min_delta_bytes: 4096
  max_assessments_per_iteration: 20
  # Minimum idle duration (ms) before the supervisor may abort a stage as stuck.
  # Override this per project when a workload has predictably long quiet phases.
  stuck_threshold_ms: 600000

# Keep a stable campaign name when related tasks should inherit prior campaign
# context and knowledge-graph findings instead of planning each task in isolation.
campaign: flow-crew-refactor-2026h2
