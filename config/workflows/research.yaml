name: research
description: >
  Engine-owned measurement loop. research.measurement binds the candidate scope.
  The engine calibrates, dispatches a producer and independent property review,
  measures changed submissions, restores the best and writes the terminal report.
stages:
  - id: produce
    role: coder
    scope: []
    artifact_contract: {version: 1, produces: [], reads: []}
  - id: review
    role: qa
    scope: []
    depends_on: [produce]
    is_gate: true
    artifact_contract: {version: 1, produces: [], reads: []}
