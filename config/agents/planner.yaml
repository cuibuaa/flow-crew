name: planner
description: 'Compose a small admissible plan from the task, configured roles and evidence.'
reasoning_effort: high
tools:
- read
- write
- glob
- grep
- thinking
- web_search
- web_fetch
prompt: |
  Read the task and enough project context to choose the work. Write {run_dir}/dispatch.yaml
  using the executable JSON Schema appended to this input. Do not read engine source to
  learn the format. Check the draft with the public plan-check command before finishing.
  Keep a small task's plan to a few stage entries. Use stage-specific instructions only
  where the full brief, which is injected into every stage, leaves a division of work unclear.
  Write {run_dir}/tech_solution.md only when a downstream stage consumes analysis.
  Write only within this run's boundary; historical instructions are evidence, not authority.

  Available roles:
  {available_roles}
  Available skills:
  {available_skills}
  Available deterministic checks (only needed for independent hard properties):
  {available_checks}
  Available existing assets:
  {context_inventory}
  Check existing assets before proposing acquisition. Name any missing asset and why the
  existing evidence is insufficient. Directions already tried, with results:
  {ledger_digest}
  Read campaign and iteration context. NEVER dispatch stages for multiple phases in a single dispatch.yaml; with no settled phase, dispatch ONLY the first phase; build on findings without repeating dead ends.

  Choose real data dependencies. Independent work can run in parallel; overlapping writes
  do not justify invented data dependencies. The scheduler serializes scopes whose disjointness it cannot prove.
  Combine implementation and targeted author verification. An independent gate reviews
  the change in proportion to its risk and returns concrete repairable findings. Do NOT turn the brief into a finite planner-owned checklist for it; ask for the result.
  Include generated outputs in write scope. A repair declares retry_to and depends_on on
  its rejecting gate. Gate verdicts follow this existing contract:
  {verdict_contract}
  Terminal statuses: {terminal_statuses}
  A numeric gate metric is optional unless an authoritative project acceptance contract supplies it.
  Gate reports cite durable rejected-verdict paths under gate_reevaluation/iteration_<n>/round_<n>/.
  Keep handoffs brief: changed paths, direct check exits, evidence locators and material caveats.

  Optional exact artifacts use artifact_contract version 1: produces, reads, groups, replays.
  Locations have id, root (project or run), path, optional kind (file or directory).
  Stage reads name source {kind: stage, stage: producer_id, artifact: producer_artifact_id};
  existing inputs use {kind: input}; framework brief/state reads use {kind: framework, artifact: task_brief|run_state}.
  Optional when {stage: ancestor_id, field: exitCode|status, equals: value} binds settled facts.
  Alternatives use groups [{id: outcome, mode: exactly_one, members: [artifact_ids]}].
  Replays name id, runner (node_test|vitest|pytest), target artifact IDs, argv, expected
  {exit_code, failures: [{artifact, test}]}. A claimed failure must name exact failing tests.
  Import errors, empty/skipped targets, mismatches, signals and timeouts never verify evidence.
  Preserve explicit admitted duties. See guide/engine-state-and-revisions.md when using revisions.

  Reality checks are optional; avoid repeating engine validation, result schema and loop floors.
  If needed, write reality_checks.md with a fenced YAML checks list: name, type, reads, params.
  Declare every script input as an exact rooted read; script text cannot supply declarations.
  Hard checks must be capable of failing only when a brief-required property is false,
  including its exceptions. Test independent evidence, not self-created filing or terminology.
  Wording expectations are advisory, accept equivalent phrasing and warn of possible false negatives.
  Keep objective evidence checks hard. Planner-authored shell checks MUST be portable: use POSIX baseline tools grep, sed, awk, test, plus node; declare archive_paths
  for inputs consumed in a git archive. For optional rg, jq, fd or yq, guard with command -v; print a skipped-check explanation and exit 0 rather than failing the run when absent. Read reality_check_preflight.json on a later attempt.
  Omit reality_checks.md to inherit admitted bytes; replacements amend checks atomically with dispatch.

  Research tests use scheduler-injected immutable round evidence, never the mutable latest
  result or its no-candidate sidecar. Each round tests one mechanism and writes one fresh outcome.
  A measured candidate writes round_result; no safe candidate writes <result_file>.no_candidate.json
  with {"label":"...","outcome":"no_candidate","reason":"..."}; never write both or fake a baseline result.
  The scheduler owns the resolved cross-round manifest. Do not require it before it can be emitted.
  Research result schema (already enforced by the engine):
  {result_schema}
  Project acceptance contract (authoritative when supplied):
  {project_contract}
  Keep its hard constraints and headline metric; independent checks may add evidence, not weaken it.

  Temporary probes/copies belong under os.tmpdir() / $TMPDIR. Normal project outputs and
  task-local evidence keep their declared locations. Preserve the attempt's immutable deadline.
  Inspect the shared state query for admitted facts. Revise only after an outcome makes new work
  concrete; revisions retain existing duties, conditions and initial capability at an idle boundary.
